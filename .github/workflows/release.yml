name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version X.Y.P (Git tag vX.Y.P); main releases X.Y.0, release/X.Y releases X.Y.P"
        required: true
        default: "0.1.0"
      branch:
        description: "Branch (main or release/X.Y)"
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # protocol, core and server share one version and one vX.Y.P tag, so they are always released together.
  MODULES: protocol,core,server

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Validate branch and version
        env:
          BR: ${{ inputs.branch }}
          V: ${{ inputs.release_version }}
        run: |
          if ! [[ "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "release_version must be X.Y.P (no -SNAPSHOT)"
            exit 1
          fi
          XY="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          P="${BASH_REMATCH[3]}"
          if [ "$BR" = "main" ]; then
            [ "$P" = "0" ] || { echo "main releases X.Y.0; patch releases go from release/${XY}"; exit 1; }
          elif [ "$BR" != "release/${XY}" ]; then
            echo "Branch must be main or release/${XY} for ${V}"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Maven settings (Central Portal)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Reserve release commit and tag
        id: reserve
        env:
          VERSION: ${{ inputs.release_version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::${TAG} already exists; resuming from it"
            git fetch -q origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git checkout -q "${TAG}"
            exit 0
          fi
          bash scripts/set-reactor-version.sh "$VERSION"
          git add -A pom.xml protocol/pom.xml core/pom.xml server/pom.xml client/pom.xml e2e/pom.xml test-server/pom.xml
          git commit -m "Release ${VERSION}."
          git tag -a "${TAG}" -m "Release ${VERSION}"
          # Atomic, before publishing: if the branch moved, nothing is pushed and nothing reaches Central.
          git push --atomic origin "HEAD:${BRANCH}" "${TAG}"

      - name: Deploy to Maven Central
        env:
          VERSION: ${{ inputs.release_version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          POM="https://repo1.maven.org/maven2/io/github/andriyg76/simple-chat/server/${VERSION}/server-${VERSION}.pom"
          if curl -sfI "$POM" >/dev/null; then
            echo "::notice::${VERSION} is already on Maven Central; skipping deploy"
            exit 0
          fi
          mvn -B -ntp clean deploy -Prelease -pl "$MODULES" -am -DskipTests

      - name: Set next development version
        env:
          VERSION: ${{ inputs.release_version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git fetch -q origin "$BRANCH"
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          CURRENT=$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::notice::${BRANCH} is at ${CURRENT}; development version already set"
            exit 0
          fi
          X="${VERSION%%.*}"; REST="${VERSION#*.}"; Y="${REST%%.*}"
          # main moves to the next minor so it never shares a snapshot with release/X.Y.
          if [ "$BRANCH" = "main" ]; then NEXT="${X}.$((Y + 1))-SNAPSHOT"; else NEXT="${X}.${Y}-SNAPSHOT"; fi
          bash scripts/set-reactor-version.sh "$NEXT"
          git add -A pom.xml protocol/pom.xml core/pom.xml server/pom.xml client/pom.xml e2e/pom.xml test-server/pom.xml
          git commit -m "Prepare ${NEXT} development."
          git push origin "HEAD:${BRANCH}" || { git pull -q --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::GitHub release ${TAG} already exists"
            exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}${TAG}"
          {
            echo "## Maven Central"
            echo
            for m in ${MODULES//,/ }; do
              echo "- \`io.github.andriyg76.simple-chat:${m}:${VERSION}\`"
            done
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$RANGE" \
              | grep -vE '^- (Release [0-9]+\.[0-9]+\.[0-9]+\.|Prepare [0-9]+\.[0-9]+-SNAPSHOT development\.) ' || true
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
