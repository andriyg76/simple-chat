name: Publish snapshot

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "java/**"
      - ".github/workflows/snapshot.yml"
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Check snapshot version
        id: version
        run: |
          V=$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$V" != *-SNAPSHOT ]]; then
            echo "::notice::Version $V is not a snapshot; skipping"
          fi

      - name: Deploy snapshot to Maven Central
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        run: mvn -B -ntp deploy -pl protocol,core,server -am
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
